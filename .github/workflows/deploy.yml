name: Deploy

env:
  AWS_REGION: eu-west-3
  ECR_REGISTRY: 448406924969.dkr.ecr.eu-west-3.amazonaws.com

  BACKEND_IMAGE: photo-app-backend
  FRONTEND_IMAGE: photo-app-frontend

on:
  push:
    branches:
      - master

jobs:

  deploy:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        instance:
          - i-0d3c3e993e3c6919c
          - i-0ad746528ab986bbd

    steps:

      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        run: |
            docker build -t $BACKEND_IMAGE ./backend

            docker tag $BACKEND_IMAGE:latest \
              $ECR_REGISTRY/$BACKEND_IMAGE:latest

            docker push $ECR_REGISTRY/$BACKEND_IMAGE:latest

      - name: Build and push frontend
        run: |
            docker build -t $FRONTEND_IMAGE ./frontend

            docker tag $FRONTEND_IMAGE:latest \
              $ECR_REGISTRY/$FRONTEND_IMAGE:latest

            docker push $ECR_REGISTRY/$FRONTEND_IMAGE:latest

      - name: Deploy via SSM
        run: |
          aws ssm send-command \
            --instance-ids ${{ matrix.instance }} \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "cd /opt/photo-app",
              "docker compose pull",
              "docker compose up -d --remove-orphans", 
              "docker image prune -af"
            ]'