name: Deploy

on:
  push:
    branches:
      - main

jobs:

  deploy-ec2-1:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Deploy EC2 1

        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST_1 }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ~/photo-app
            git pull
            docker compose up --build -d

  deploy-ec2-2:

    runs-on: ubuntu-latest

    needs: deploy-ec2-1

    steps:

      - uses: actions/checkout@v4

      - name: Deploy EC2 2

        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST_2 }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ~/photo-app
            git pull
            docker compose up --build -d     