name: Deploy

env:
  AWS_REGION: eu-west-3
  ECR_REGISTRY: 448406924969.dkr.ecr.eu-west-3.amazonaws.com

  BACKEND_IMAGE: photo-app-dev-tf-backend
  FRONTEND_IMAGE: photo-app-dev-tf-frontend

on:
  push:
    branches:
      - master


# JOB # 1 : Build --> push images in ECR
# JOB # 2 : Deploy for each EC2 (matrix) 

jobs:
# JOB 1 : Build & Push (Exécuté UNE seule fois)
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        run: |
          docker build -t $BACKEND_IMAGE ./backend
          docker tag $BACKEND_IMAGE:latest $ECR_REGISTRY/$BACKEND_IMAGE:latest
          docker push $ECR_REGISTRY/$BACKEND_IMAGE:latest

      - name: Build and push frontend
        run: |
          docker build -t $FRONTEND_IMAGE ./frontend
          docker tag $FRONTEND_IMAGE:latest $ECR_REGISTRY/$FRONTEND_IMAGE:latest
          docker push $ECR_REGISTRY/$FRONTEND_IMAGE:latest

  # JOB 2 : Deploiement sur chaque instance EC2 via la Matrice
  deploy:
    needs: build-and-push # Attend que le job 1 soit terminé
    runs-on: ubuntu-latest
    strategy:
      matrix:
        instance:
          - i-024bb762c147bf58b
          - i-0dffc047d1fa63496

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ matrix.instance }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploying photo-app" \
            --parameters 'commands=[
              "aws ecr get-login-password --region '$AWS_REGION' | docker login --username AWS --password-stdin '$ECR_REGISTRY'",
              "cd /opt/photo-app",
              "docker compose pull",
              "docker compose up -d --remove-orphans",
              "docker image prune -af",
              "docker system df"
            ]'

