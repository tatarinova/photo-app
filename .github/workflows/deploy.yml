name: Deploy

env:
  ECR_REGISTRY: 448406924969.dkr.ecr.eu-west-3.amazonaws.com

on:
  push:
    branches:
      - master

jobs:

  deploy:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        instance:
          - i-0d3c3e993e3c6919c
          - i-0ad746528ab986bbd

    steps:

      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        run: |
            docker build -t photo-app-backend ./backend

            docker tag photo-app-backend:latest \
              $ECR_REGISTRY/photo-app-backend:latest

            docker push $ECR_REGISTRY/photo-app-backend:latest

      - name: Build and push frontend
        run: |
            docker build -t photo-app-frontend ./frontend

            docker tag photo-app-frontend:latest \
              $ECR_REGISTRY/photo-app-frontend:latest

            docker push $ECR_REGISTRY/photo-app-frontend:latest

      - name: Deploy via SSM
        run: |
          aws ssm send-command \
            --instance-ids ${{ matrix.instance }} \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "cd /home/ubuntu/photo-app",
              "docker compose pull",
              "docker compose up -d"
            ]'