services:
  backend:
    image: 448406924969.dkr.ecr.eu-west-3.amazonaws.com/photo-app-dev-tf-backend

    expose:
      - "8000"

    env_file:
      - .env

    restart: unless-stopped  

  frontend:
    image: 448406924969.dkr.ecr.eu-west-3.amazonaws.com/photo-app-dev-tf-frontend

    ports:
      - "80:80"

    depends_on:
      - backend

    restart: unless-stopped