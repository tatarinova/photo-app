services:
  backend:
    build: ./backend
    #ports:
    #  - "8000:8000"
    expose:
      - "8000"

    environment:
      BUCKET_NAME: mafalda-
      
    restart: unless-stopped

  frontend:
    build: ./frontend

    #ports:
    #  - "8080:80"
    ports:
      - "80:80"

    depends_on:
      - backend

    restart: unless-stopped